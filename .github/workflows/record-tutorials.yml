name: Record CadCove tutorials
on:
  workflow_dispatch:
  push:
    branches: [demo/cloud-quickstart-recording]
    paths: [.github/workflows/record-tutorials.yml, scripts/video/tutorial-driver.cjs, scripts/video/record-tutorials.js]
permissions:
  contents: read
  actions: read
jobs:
  record:
    strategy:
      fail-fast: false
      matrix:
        mode: [edit, simulation]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CADCOVE_RECORD_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb openbox ffmpeg libgtk-3-0 libnss3 libgbm1 libasound2t64 openjdk-17-jdk
          bun install --frozen-lockfile
          python -m pip install -r vendor/cad-core/src/native/requirements.txt
          echo "CADCOVE_PYTHON=$(python -c 'import sys;print(sys.executable)')" >> "$GITHUB_ENV"
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
      - name: Download qualified Linux extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 39322759678 -n toolbox-candidate-ubuntu-24.04 -D artifacts/qualified
      - name: Prepare real Team 3310 simulation
        if: matrix.mode == 'simulation'
        run: bun run example:team --output build/Amarillo-REBUILT
      - name: Record editor workflow
        run: xvfb-run -a -s '-screen 0 1920x1080x24 -ac' bun scripts/video/record-tutorials.js
      - name: Save footage and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cadcove-tutorial-${{ matrix.mode }}
          path: artifacts/tutorial-${{ matrix.mode }}
          retention-days: 14
          if-no-files-found: warn
