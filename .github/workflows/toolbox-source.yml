name: Toolbox source and platform build
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: toolbox-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 4
      CADCOVE_TEST_EDITOR_VERSION: 1.105.1
      # Hosted runners have no guaranteed hardware GPU. This validates editor
      # integration and rendering correctness, not hardware performance.
      CADCOVE_TEST_SOFTWARE_GPU: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.91.1
      - name: Prepare Linux display and graphics libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libgbm1 libasound2t64
      - name: Build public source and test the installed editor (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a bun scripts/verify-toolbox-source.js --output "${{ runner.temp }}/cadcove-source" --editor
      - name: Build public source and test the installed editor (Windows/macOS)
        if: runner.os != 'Linux'
        run: bun scripts/verify-toolbox-source.js --output "${{ runner.temp }}/cadcove-source" --editor
      - name: Preserve source and build qualification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: toolbox-reports-${{ matrix.os }}
          path: |
            artifacts/source-verification-report.json
            ${{ runner.temp }}/cadcove-source/source-provenance.json
            ${{ runner.temp }}/cadcove-source/artifacts/toolbox-extension-test-report.json
          if-no-files-found: warn
          retention-days: 14
      # This gate does not publish binaries or upload team fixtures. WPILib's
      # companion extensions, vendor SDKs, licensing and hardware performance
      # qualification remain separate from this installed stock-editor check.
