name: Toolbox source and platform build
on:
  pull_request:
  push:
    branches: [main, release/native-cadquery-0.2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: toolbox-${{ github.workflow }}-${{ github.ref }}
  # Do not interrupt a Marketplace upload halfway through its platform set.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      extension: ${{ steps.version.outputs.extension }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - id: version
        run: echo "extension=$(bun scripts/marketplace-artifacts.js version)" >> "$GITHUB_OUTPUT"
  source-build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CADCOVE_EXTENSION_VERSION: ${{ needs.version.outputs.extension }}
      CARGO_BUILD_JOBS: 4
      CADCOVE_TEST_EDITOR_VERSION: 1.105.1
      # Hosted runners have no guaranteed hardware GPU. This validates editor
      # integration and rendering correctness, not hardware performance.
      CADCOVE_TEST_SOFTWARE_GPU: '1'
      CADCOVE_TEST_PREPARE_SANDBOX: '1'
    steps:
      - name: Allow long Windows checkout paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.91.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned native CAD dependencies
        run: python -m pip install -r vendor/cad-core/src/native/requirements.txt
      - name: Warm and verify the installed CAD dependencies
        run: python -c "import cadquery; import OCP; print(cadquery.__version__)"
      - name: Select native CAD interpreter
        shell: bash
        run: echo "CADCOVE_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Prepare Linux display and graphics libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libgbm1 libasound2t64
      - name: Build public source and test the installed editor (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a bun scripts/verify-toolbox-source.js --output "${{ runner.temp }}/cadcove-source" --editor
      - name: Build public source and test the installed editor (macOS)
        if: runner.os == 'macOS'
        run: bun scripts/verify-toolbox-source.js --output "${{ runner.temp }}/cadcove-source" --editor
      # Hosted Windows runners lack a WebGPU adapter. Native/CLI/package checks
      # run here; installed-editor qualification runs on a Windows GPU host.
      # The report records editorInstallationTested=false, never a skipped pass.
      - name: Build and test the native Windows package
        if: runner.os == 'Windows'
        run: bun scripts/verify-toolbox-source.js --output "${{ runner.temp }}/cadcove-source"
      - name: Preserve source and build qualification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: toolbox-reports-${{ matrix.os }}
          path: |
            artifacts/source-verification-report.json
            ${{ runner.temp }}/cadcove-source/source-provenance.json
            ${{ runner.temp }}/cadcove-source/artifacts/toolbox-extension-test-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve qualified release candidate
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: toolbox-candidate-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/cadcove-source/artifacts/cadcove-source-check.vsix
            ${{ runner.temp }}/cadcove-source/artifacts/runtime-source-check/THIRD-PARTY-NOTICES.txt
            ${{ runner.temp }}/cadcove-source/artifacts/runtime-source-check/dependency-inventory.json
            ${{ runner.temp }}/cadcove-source/artifacts/runtime-source-check/cli-build.json
          if-no-files-found: error
          retention-days: 14
      # Build jobs do not publish packages or upload team fixtures. WPILib's
      # companion extensions, vendor SDKs, licensing and hardware performance
      # qualification remain separate from this installed stock-editor check.

  marketplace:
    name: Publish tested Marketplace packages
    needs: [version, source-build]
    if: >-
      github.repository == 'gfleming1992/CadCove-FRC' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.MARKETPLACE_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      CADCOVE_EXTENSION_VERSION: ${{ needs.version.outputs.extension }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: toolbox-*
          path: artifacts/marketplace
      - name: Validate complete platform set and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/publish-marketplace.js artifacts/marketplace
