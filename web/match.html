<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CadCove shared field</title>
<style>
:root{color-scheme:dark;font:14px system-ui,sans-serif;background:#101821;color:#e3edf7}*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column}header{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:12px 18px;border-bottom:1px solid #344251;background:#182431}header strong{margin-right:auto}button,select{font:inherit;padding:7px 12px;border:1px solid #576b7d;border-radius:5px;background:#243548;color:inherit}button:enabled{cursor:pointer}button:disabled{opacity:.4}#enable{background:#155a44}#disable{background:#7b2c32}#status{padding:10px 18px;color:#b9cddd;min-height:38px}#status[data-error="true"]{color:#ffb6b6}main{flex:1;min-height:0;position:relative}canvas{width:100%;height:100%;display:block}footer{padding:8px 18px;border-top:1px solid #344251;color:#a9bfce;font-size:12px}#metrics{margin-left:auto;font-variant-numeric:tabular-nums}.hint{opacity:.8}
</style></head><body>
<header><strong>CadCove · Shared field</strong><span id="role">Connecting</span><label>View <select id="view"><option value="field">Entire field</option></select></label><label>Graphics <select id="quality"><option value="auto">Auto</option><option value="performance">Performance</option><option value="high">High</option></select></label><label><input id="follow" type="checkbox"> Follow</label><button id="enable" disabled>Enable robot</button><button id="disable" disabled>Disable</button></header>
<div id="status" role="status">Preloading game assets…</div><main><canvas aria-label="Shared robot field"></canvas></main>
<footer><span class="hint">WASD: drive · Q/E: turn · Shift: slow · F/R: operator B/A · Space: operator right trigger. Gamepads: driver port 1, operator port 0.</span> <span id="metrics"></span><div>Server-authoritative state · No client prediction · Orbit, pan and zoom locally</div></footer>
<script type="module" src="/match-client.js"></script></body></html>
